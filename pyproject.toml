[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spy-market-intelligence"
version = "0.1.0"
description = "A transparent SPY market-monitoring MVP"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10",
  "numpy>=1.26",
  "pandas>=2.2",
  "plotly>=5.20",
  "streamlit>=1.49",
  "yfinance>=0.2.40"
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
